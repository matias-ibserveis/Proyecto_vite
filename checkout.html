  <style>
/* Animación general desde arriba */
.aparecer-desde-arriba {
  animation: slideDownFadeIn 0.7s ease;
}
@keyframes slideDownFadeIn {
  from { opacity: 0; transform: translateY(-40px);}
  to   { opacity: 1; transform: translateY(0);}
}
/* Textarea más lento */
.aparecer-desde-arriba-textarea {
  animation: slideDownFadeInTextarea 1.1s ease;
}
@keyframes slideDownFadeInTextarea {
  from { opacity: 0; transform: translateY(-40px);}
  to   { opacity: 1; transform: translateY(0);}
}

/* Animación para el popup de despedida */
@keyframes bounceIn {
  0% { transform: scale(0.3); opacity: 0; }
  50% { transform: scale(1.05); opacity: 1; }
  70% { transform: scale(0.9); }
  100% { transform: scale(1); opacity: 1; }
}

/* Animación de salida para el popup de despedida */
@keyframes bounceOut {
  0% { transform: scale(1); opacity: 1; }
  20% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(0.3); opacity: 0; }
}

@keyframes fadeOutBackground {
  0% { opacity: 1; }
  100% { opacity: 0; }
}

.goodbye-popup-fadeout {
  animation: fadeOutBackground 0.6s ease-out forwards;
}

.goodbye-popup-fadeout .goodbye-popup-content {
  animation: bounceOut 0.6s ease-out forwards;
}

  <script type="module">
    import { CheckoutNavbar } from '/src/components/CheckoutNavbar.js';
    import { CartHeader } from '/src/components/CartHeader.js';


    // Render components
    const navbar = document.getElementById('navbar');
    const cartHeader = document.getElementById('cart-header');
    const popupContainer = document.getElementById('checkout-popup-container');
    if (navbar) {
      navbar.appendChild(CheckoutNavbar());
    }
    if (cartHeader) {
      cartHeader.appendChild(CartHeader());
    }


    // Calculate subtotal
function calculateSubtotal(cart) {
  return cart.reduce((total, item) => {
    // Si es cesta, suma su precio * cantidad, si no, igual
    const itemTotal = item.type === 'cesta'
      ? (item.price * (item.quantity || 1))
      : (item.quantity * item.price);
    return total + itemTotal;
  }, 0).toFixed(2);
}

    // SIMPLE: Obtener foto de la API
    async function getFotoAPI() {
      try {
        const res = await fetch('https://api-proyecto-lura-enviar-cesta-production.up.railway.app/api/cestas_productos');
        const data = await res.json();
        console.log('API Response checkout:', data); // Para debug
        if (data.length > 0 && data[0].foto) {
          console.log('URL original de la API checkout:', data[0].foto);
          // Convertir URL de Google Drive si es necesario
          const fotoConvertida = convertirGoogleDriveUrl(data[0].foto);
          console.log('URL convertida para mostrar checkout:', fotoConvertida);
          return fotoConvertida; // SIEMPRE usar la foto de la API convertida
        }
        console.log('No foto found in API checkout');
        return null; // No hay foto, devolver null
      } catch (err) {
        console.error('Error fetching foto from API checkout:', err);
        return null; // Error, devolver null
      }
    }

    // Función para convertir URLs de Google Drive
    function convertirGoogleDriveUrl(url) {
      if (url.includes('drive.google.com')) {
        const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match) {
          return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800-h600`;
        }
      }
      return url;
    }

    // Render subtotal
    function renderSubtotal() {
      const subtotalAmount = document.getElementById('subtotal-amount');
      if (subtotalAmount) {
        const cart = JSON.parse(sessionStorage.getItem('cart') || '[]');
        const subtotal = calculateSubtotal(cart);
        subtotalAmount.textContent = `€${subtotal}`;
      }
    }

    // Render cart items
    async function renderCheckoutCart() {
      const cartBody = document.getElementById('cart-body');
      if (!cartBody) return;

      const cart = JSON.parse(sessionStorage.getItem('cart') || '[]');
      cartBody.innerHTML = '';

      if (cart.length === 0) {
        const emptyRow = document.createElement('tr');
        emptyRow.innerHTML = `
          <td colspan="4" style="text-align: center; padding: 1rem; color: var(--secondary-color);">
            Su Carro no es Saludable para Nosotras ;).
          </td>
        `;
        cartBody.appendChild(emptyRow);
      } else {
        for (const [index, item] of cart.entries()) {
          const row = document.createElement('tr');
          row.className = 'cart-item-row';
          row.dataset.index = index;
          
let imageUrl = "https://via.placeholder.com/250x250?text=Sin+Imagen";
if (item.type === 'cesta') {
  const fotoAPI = await getFotoAPI();
  imageUrl = fotoAPI || "https://via.placeholder.com/250x250?text=Sin+Imagen";
} else if (
  item.imagen1 &&
  item.imagen1 !== "null" &&
  item.imagen1 !== "(Null)" &&
  item.imagen1 !== null
) {
  if (item.imagen1.includes("drive.google.com")) {
    const driveRegex = /\/d\/([a-zA-Z0-9_-]+)|id=([a-zA-Z0-9_-]+)/;
    const match = item.imagen1.match(driveRegex);
    if (match && (match[1] || match[2])) {
      imageUrl = `https://drive.google.com/thumbnail?id=${match[1] || match[2]}&sz=w800-h600`;
    } else {
      imageUrl = item.imagen1;
    }
  } else {
    imageUrl = item.imagen1;
  }
}

          let productDetails = '';
          if (item.type === 'cesta') {
            // CÓDIGO CORREGIDO AQUÍ ⬅️
            const ingredientsList = item.ingredients
              .filter(ing => ing && ing.titulo && ing.cantidad_producto) // Filtrar elementos válidos
              .map(ing => {
                // Incluir unidad de medida si está disponible
                const unidad = ing.unidad_medida || '';
                const cantidadConUnidad = unidad ? `${ing.cantidad_producto} ${unidad}` : ing.cantidad_producto;
                return `${ing.titulo}: ${cantidadConUnidad}`;
              })
              .join('<br>');
            
            productDetails = `
              <div class="cart-item-details">
                <div class="cart-item-name">${item.name}</div>
                <div class="cart-item-ingredients">${ingredientsList || 'Sin productos disponibles'}</div>
              </div>
            `;
          } else {
            // Para productos individuales, mostrar precio y peso/unidad de medida
            let priceInfo = `€${item.price.toFixed(2)}`;
            
            // Agregar peso/unidad si está disponible
            if (item.valor_medido && item.unidad_medida) {
              priceInfo += ` - ${item.valor_medido} ${item.unidad_medida}`;
            } else if (item.unidad_medida) {
              priceInfo += ` - ${item.unidad_medida}`;
            }
            
            productDetails = `
              <div class="cart-item-details">
                <div class="cart-item-name">${item.name}</div>
                <div class="cart-item-price">${priceInfo}</div>
              </div>
            `;
          }

          const total = ((item.quantity || 1) * item.price).toFixed(2);
          
          // Para la primera cesta, mostrar un espacio vacío en lugar del botón eliminar para mantener simetría
          const removeButton = (index === 0 && item.type === 'cesta') 
            ? '<div style="width: 24px; height: 24px;"></div>' // Espacio vacío del mismo tamaño que el botón ✕
            : `<button class="remove-btn" data-index="${index}">✕</button>`;
          
          row.innerHTML = `
            <td class="cart-item-image-cell">
              <img src="${imageUrl}" alt="${item.name}" class="cart-item-image" onerror="this.src='/images/logo.png'" />
            </td>
            <td class="cart-item-details-cell">${productDetails}</td>
            <td class="cart-item-quantity-total-cell">
              <div class="quantity-total-container">
                <div class="quantity-control">
                  <button class="quantity-btn decrease" data-index="${index}">-</button>
                  <span class="quantity-display">${item.quantity}</span>
                  <button class="quantity-btn increase" data-index="${index}">+</button>
                </div>
                <span class="cart-item-total">€${total}</span>
              </div>
            </td>
            <td class="cart-item-remove-cell">
              ${removeButton}
            </td>
          `;
          cartBody.appendChild(row);
        }

        cartBody.querySelectorAll('.quantity-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const index = parseInt(e.target.dataset.index);
            const cart = JSON.parse(sessionStorage.getItem('cart') || '[]');
            const item = cart[index];

            if (e.target.classList.contains('increase')) {
              item.quantity += 1;
            } else if (e.target.classList.contains('decrease')) {
              // Si es el primer producto (índice 0) y es una cesta, mínimo cantidad 1
              if (index === 0 && item.type === 'cesta') {
                if (item.quantity > 1) {
                  item.quantity -= 1;
                }
                // Si ya está en 1, no hacer nada (no disminuir)
              } else {
                // Para productos que no son la primera cesta
                if (item.quantity > 1) {
                  item.quantity -= 1;
                } else {
                  // Si cantidad es 1 y presiona "-", eliminar el producto
                  cart.splice(index, 1);
                }
              }
            }

            sessionStorage.setItem('cart', JSON.stringify(cart));
            await renderCheckoutCart();
            renderSubtotal();
          });
        });

        cartBody.querySelectorAll('.remove-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const index = parseInt(e.target.dataset.index);
            const cart = JSON.parse(sessionStorage.getItem('cart') || '[]');
            
            // No permitir eliminar el primer producto si es una cesta
            if (index === 0 && cart[index].type === 'cesta') {
              return; // No hacer nada, no eliminar la cesta principal
            }
            
            cart.splice(index, 1);
            sessionStorage.setItem('cart', JSON.stringify(cart));
            await renderCheckoutCart();
            renderSubtotal();
          });
        });
      }

      renderSubtotal();
    }

    // Handle special instructions
    function renderSpecialInstructions() {
      const instructionsTextarea = document.getElementById('order-instructions');
      if (instructionsTextarea) {
        const savedInstructions = sessionStorage.getItem('orderInstructions') || '';
        instructionsTextarea.value = savedInstructions;

        instructionsTextarea.addEventListener('input', () => {
          const instructions = instructionsTextarea.value.trim();
          if (instructions) {
            sessionStorage.setItem('orderInstructions', instructions);
          } else {
            sessionStorage.removeItem('orderInstructions');
          }
        });
      }
    }


    // Initial render
    (async () => {
      await renderCheckoutCart();
      renderSpecialInstructions();
      setupCheckoutButton();
    })();

    // Re-render on storage changes
    window.addEventListener('storage', async (e) => {
      if (e.key === 'cart' || e.key === 'orderInstructions') {
        await renderCheckoutCart();
        renderSpecialInstructions();
      }
    });
  </script>

  });

  // Validación en tiempo real para el selector
  const select = document.getElementById('opcion-especial');
  select.addEventListener('change', function() {
    if (this.value) {
      this.style.backgroundColor = '#a3e0a5';
      this.style.boxShadow = '0 0 0 2px #4CAF5077';
    } else {
      this.style.backgroundColor = '#ffc8c8';
      this.style.boxShadow = '';
    }
  });
</script>
<div style="height: 250px; width: 100%;"></div>


</body>
